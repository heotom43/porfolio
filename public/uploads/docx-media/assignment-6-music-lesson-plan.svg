<svg xmlns="http://www.w3.org/2000/svg" width="760" height="470" viewBox="0 0 760 470">
  <rect width="760" height="470" fill="#fff"/>
  <rect x="12" y="22" width="736" height="42" fill="#112d4b"/>
  <g stroke="#aebfd1" stroke-width="1"><rect x="12" y="22" width="736" height="424" fill="none"/><path d="M12 64H748M12 154H748M12 244H748M12 334H748M12 446H748M65 22V446M224 22V446M447 22V446M606 22V446" fill="none"/><rect x="12" y="154" width="736" height="90" fill="#f2f6f9" stroke="none"/><rect x="12" y="334" width="736" height="112" fill="#f2f6f9" stroke="none"/></g>
  <g font-family="Georgia,'Times New Roman',serif" font-size="11.5" fill="#17212e">
    <g fill="#fff" font-weight="bold"><text x="20" y="40"><tspan x="20">Tiến trình Sư</tspan><tspan x="20" dy="15">phạm (5512)</tspan></text><text x="73" y="48">Hoạt động dạy học</text><text x="232" y="40"><tspan x="232">Độc bản của</tspan><tspan x="232" dy="15">sinh viên</tspan></text><text x="455" y="40"><tspan x="455">Cơ sở lý luận Âm nhạc</tspan><tspan x="455" dy="15">&amp; Ngữ âm</tspan></text><text x="614" y="40"><tspan x="614">Đánh giá năng lực</tspan><tspan x="614" dy="15">học sinh THPT</tspan></text></g>
    <text x="20" y="104"><tspan x="20">1. Hoạt động Khởi động</tspan><tspan x="20" dy="16">(6 phút)</tspan></text>
    <text x="73" y="84"><tspan x="73">Đối thoại thẩm mỹ “Thanh âm</tspan><tspan x="73" dy="16">của mùa thu”: GV trình diễn</tspan><tspan x="73" dy="16">trích đoạn trên đàn Piano để</tspan><tspan x="73" dy="16">học sinh lắng nghe và liên hệ</tspan><tspan x="73" dy="16">tranh thu của Xuân Diệu.</tspan></text>
    <text x="232" y="98"><tspan x="232">Lý thuyết Thẩm mỹ Liên</tspan><tspan x="232" dy="16">nghệ thuật (Synaesthesia in</tspan><tspan x="232" dy="16">Music Education) – Kích hoạt</tspan><tspan x="232" dy="16">trí tưởng tượng hình tượng.</tspan></text>
    <text x="455" y="98"><tspan x="455">Năng lực Cảm thụ âm</tspan><tspan x="455" dy="16">nhạc: Khả năng liên kết</tspan><tspan x="455" dy="16">màu sắc hòa thanh với hình</tspan><tspan x="455" dy="16">tượng thơ ca.</tspan></text>
    <text x="20" y="194"><tspan x="20">2. Hoạt động Khám phá</tspan><tspan x="20" dy="16">(14 phút)</tspan></text>
    <text x="73" y="174"><tspan x="73">Giải mã bản đồ thanh điệu</tspan><tspan x="73" dy="16">Thơ: GV hướng dẫn giải ngân</tspan><tspan x="73" dy="16">cảm thơ theo nhịp 6/8, dùng</tspan><tspan x="73" dy="16">tay vẽ đường lượn cao độ.</tspan></text>
    <text x="232" y="184"><tspan x="232">Lý thuyết Tương quan Ngữ</tspan><tspan x="232" dy="16">âm – Giai điệu tiếng Việt</tspan><tspan x="232" dy="16">kết hợp vận động cơ thể.</tspan></text>
    <text x="455" y="184"><tspan x="455">Năng lực Hiểu biết âm</tspan><tspan x="455" dy="16">nhạc: Nắm vững quy luật</tspan><tspan x="455" dy="16">cao thấp tiếng Việt khi đặt</tspan><tspan x="455" dy="16">lời cho giai điệu.</tspan></text>
    <text x="20" y="284"><tspan x="20">3. Hoạt động Luyện tập</tspan><tspan x="20" dy="16">(15 phút)</tspan></text>
    <text x="73" y="264"><tspan x="73">Xưởng sáng tác nhóm:</tspan><tspan x="73" dy="16">HS làm việc theo nhóm, sử</tspan><tspan x="73" dy="16">dụng đàn Keyboard và phần</tspan><tspan x="73" dy="16">mềm ghi âm để hoàn thiện</tspan><tspan x="73" dy="16">giai điệu cho bài thơ.</tspan></text>
    <text x="232" y="274"><tspan x="232">Phương pháp Dạy học Dự án</tspan><tspan x="232" dy="16">Âm nhạc (Music Project-Based</tspan><tspan x="232" dy="16">Learning) và hòa âm màu sắc</tspan><tspan x="232" dy="16">đương đại.</tspan></text>
    <text x="455" y="274"><tspan x="455">Năng lực Thể hiện &amp; Sáng</tspan><tspan x="455" dy="16">tác: Kỹ năng viết nốt nhạc</tspan><tspan x="455" dy="16">và biểu cảm qua phối hợp hòa</tspan><tspan x="455" dy="16">âm tập thể.</tspan></text>
    <text x="20" y="384"><tspan x="20">4. Hoạt động Vận dụng</tspan><tspan x="20" dy="16">(10 phút)</tspan></text>
    <text x="73" y="354"><tspan x="73">Trình diễn “Giai điệu Thơ</tspan><tspan x="73" dy="16">Mới”: Đại diện nhóm hát</tspan><tspan x="73" dy="16">hoặc trình bày đệm Piano;</tspan><tspan x="73" dy="16">cả lớp phản hồi và điều chỉnh</tspan><tspan x="73" dy="16">đường nét giai điệu.</tspan></text>
    <text x="232" y="374"><tspan x="232">Triết lý Cộng đồng Thực</tspan><tspan x="232" dy="16">hành Âm nhạc (Community of</tspan><tspan x="232" dy="16">Musical Practice) trong trường</tspan><tspan x="232" dy="16">phổ thông.</tspan></text>
    <text x="455" y="374"><tspan x="455">Năng lực Ứng dụng &amp; Phản</tspan><tspan x="455" dy="16">biện thẩm mỹ: Tự tin biểu</tspan><tspan x="455" dy="16">diễn tác phẩm cá nhân và</tspan><tspan x="455" dy="16">đánh giá nghệ thuật khách quan.</tspan></text>
  </g>
  <text x="380" y="466" text-anchor="middle" font-family="Georgia,serif" font-size="12" fill="#8aa0b5">Trang 5 / 10</text>
</svg>
