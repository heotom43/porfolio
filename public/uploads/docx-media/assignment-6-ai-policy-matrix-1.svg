<svg xmlns="http://www.w3.org/2000/svg" width="760" height="390" viewBox="0 0 760 390">
  <rect width="760" height="390" fill="#fff"/>
  <text x="18" y="22" font-family="Georgia,serif" font-size="14" font-weight="bold" fill="#173452">Bảng 1: Ma trận đối chiếu khung chính sách sử dụng AI giữa VNAM và Nhạc viện Hoàng gia Anh (RAM)</text>
  <g stroke="#aec1d5" stroke-width="1"><rect x="14" y="32" width="732" height="342" fill="#fff"/><rect x="14" y="32" width="732" height="48" fill="#112d4b" stroke="#112d4b"/><rect x="14" y="80" width="732" height="146" fill="#f1f5f8" stroke="none"/><path d="M14 32H746M14 80H746M14 226H746M14 374H746M14 32V374M146 32V374M337 32V374M536 32V374M746 32V374" fill="none"/></g>
  <g font-family="Georgia,'Times New Roman',serif" font-size="11.5" fill="#142234">
    <g fill="#fff" font-weight="bold"><text x="24" y="52"><tspan x="24">Tiêu chí so</tspan><tspan x="24" dy="15">sánh</tspan></text><text x="156" y="50"><tspan x="156">Học viện Âm nhạc Quốc gia</tspan><tspan x="156" dy="15">Việt Nam (VNAM)</tspan></text><text x="347" y="50"><tspan x="347">Nhạc viện Hoàng gia Anh</tspan><tspan x="347" dy="15">(RAM, London)</tspan></text><text x="546" y="50"><tspan x="546">Ý nghĩa chuyên môn đối với</tspan><tspan x="546" dy="15">Sư phạm Âm nhạc</tspan></text></g>
    <text x="24" y="149"><tspan x="24">Triết lý tiếp</tspan><tspan x="24" dy="15">cận</tspan></text>
    <text x="156" y="103"><tspan x="156">Đề cao sự khổ luyện kỹ năng</tspan><tspan x="156" dy="15">thực hành thủ công, bản sắc</tspan><tspan x="156" dy="15">âm nhạc dân tộc và đạo đức</tspan><tspan x="156" dy="15">mẫu mực của người giáo viên</tspan><tspan x="156" dy="15">nghệ thuật.</tspan></text>
    <text x="347" y="103"><tspan x="347">Coi AI là một công cụ thử</tspan><tspan x="347" dy="15">nghiệm thẩm mỹ (Experimental</tspan><tspan x="347" dy="15">Aesthetic Tool); nhấn mạnh tư</tspan><tspan x="347" dy="15">duy phản biện nghệ thuật và</tspan><tspan x="347" dy="15">tính xác thực biểu diễn.</tspan></text>
    <text x="546" y="103"><tspan x="546">RAM khuyến khích dùng AI để</tspan><tspan x="546" dy="15">kiểm chứng giả thuyết âm học;</tspan><tspan x="546" dy="15">VNAM bảo đảm sinh viên nắm</tspan><tspan x="546" dy="15">vững nền tảng kỹ thuật hòa âm</tspan><tspan x="546" dy="15">- xướng âm cổ điển.</tspan></text>
    <text x="24" y="282"><tspan x="24">Quy định trong</tspan><tspan x="24" dy="15">sáng tác &amp; hòa</tspan><tspan x="24" dy="15">âm</tspan></text>
    <text x="156" y="246"><tspan x="156">Nghiêm cấm tuyệt đối việc</tspan><tspan x="156" dy="15">dùng AI làm hộ bài tập hòa</tspan><tspan x="156" dy="15">thanh, Phức điệu, Phân tích</tspan><tspan x="156" dy="15">tác phẩm và Sáng tác ca khúc</tspan><tspan x="156" dy="15">sơ cấp.</tspan></text>
    <text x="347" y="246"><tspan x="347">Nghiêm cấm nộp tác phẩm do</tspan><tspan x="347" dy="15">AI tạo sinh (AI-generated</tspan><tspan x="347" dy="15">compositions); cho phép dùng AI</tspan><tspan x="347" dy="15">hỗ trợ nghiên cứu âm sắc nhưng</tspan><tspan x="347" dy="15">phải nộp kèm bản thảo viết tay.</tspan></text>
    <text x="546" y="246"><tspan x="546">Yêu cầu nộp bản phác thảo viết</tspan><tspan x="546" dy="15">tay (Handwritten Sketches) giúp</tspan><tspan x="546" dy="15">kiểm chứng quá trình tư duy</tspan><tspan x="546" dy="15">giai điệu tự nhiên của sinh viên.</tspan></text>
  </g>
</svg>
